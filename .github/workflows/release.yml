# Release bei jedem Tag "v*" (z.B. v1.0.0): erst alle Tests, dann packt der
# BigWigs-Packager die ZIP, erstellt ein GitHub-Release und lädt zu CurseForge, Wago und WoWInterface hoch.
# Jede Plattform braucht ihre ID in der .toc und ihr Secret, sonst wird sie übersprungen:
#   CurseForge:  "## X-Curse-Project-ID"  + Secret CF_API_KEY
#   Wago:        "## X-Wago-ID"           + Secret WAGO_API_TOKEN
#   WoWInterface: "## X-WoWI-ID"          + Secret WOWI_API_TOKEN
# Fehlt alles, entsteht nur das GitHub-Release.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: tools/*/go.sum
      - run: make test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # GitHub-Release anlegen
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Packager braucht die Historie für Version und Changelog
      # Datei und Anzeigename auf CurseForge einheitlich "LevelTimer-v1.2.3(.zip)" wie bei den
      # früheren Uploads; ohne -n hieße der Upload nur "v1.2.3" (Format: "{datei}:{label}")
      - uses: BigWigsMods/packager@v2
        with:
          args: -n "{package-name}-{project-version}:{package-name}-{project-version}.zip"

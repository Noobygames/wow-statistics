<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Level Time: Dungeonquest-Hinweise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1000px; height: 520px; box-sizing: border-box; background: #22302a; padding: 24px; font-family: Inter, system-ui, sans-serif; color: #f2f2f2; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start">

  <!-- Zonen-Hinweis (Assist/DungeonQuestHints.lua, Fenster UI/DungeonQuestHint.lua) -->
  <section style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #9fb3a8">Beim Betreten einer Zone (einmal je Zone und Sitzung, schließt nach 20 s)</span>
    <sc-if value="{{zoneOpen}}" hint-placeholder-val="true">
      <div style="background: rgba(8,8,10,0.92); border: 1px solid #555; border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; max-width: 420px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span style="font-weight: 700; color: #ffd100">Dungeonquests in Westfall</span>
          <button type="button" onclick="{{closeZone}}" style="width: 22px; height: 22px; background: #1d1d1d; border: 1px solid #555; border-radius: 3px; color: #eee; cursor: pointer">×</button>
        </div>
        <sc-for list="{{zoneRows}}" as="r" hint-placeholder-count="3">
          <button type="button" onclick="{{r.pick}}" style="text-align: left; background: none; border: 0; padding: 2px 0; color: #f2f2f2; cursor: pointer; font-size: 13px; display: flex; flex-direction: column">
            <span>{{r.title}} <span style="color: #9fd0ff">({{r.instance}})</span></span>
            <span style="color: #bbb; font-size: 12px">{{r.giver}} – {{r.place}}</span>
          </button>
        </sc-for>
        <span style="color: #888; font-size: 11px">Klick: Kartenpunkt setzen und Karte öffnen</span>
      </div>
    </sc-if>
    <sc-if value="{{!zoneOpen}}" hint-placeholder-val="false">
      <button type="button" onclick="{{openZone}}" style="align-self: flex-start; height: 32px; padding: 0 12px; background: #1d1d1d; border: 1px solid #555; border-radius: 4px; color: #eee">Zone erneut betreten</button>
    </sc-if>
  </section>

  <!-- Nach der Annahme (Assist/DungeonQuestHints.lua) -->
  <section style="display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; color: #9fb3a8">Nach Annahme einer Dungeonquest oder eines Kettenschritts</span>
    <div style="background: rgba(8,8,10,0.92); border: 1px solid #555; border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; max-width: 420px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <span style="font-weight: 700; color: #ffd100">Weitere Quests für Die Todesminen</span>
        <span style="width: 22px; height: 22px; border: 1px solid #555; border-radius: 3px; text-align: center">×</span>
      </div>
      <sc-for list="{{acceptRows}}" as="r" hint-placeholder-count="4">
        <button type="button" onclick="{{r.pick}}" style="text-align: left; background: none; border: 0; padding: 2px 0; color: {{r.color}}; cursor: pointer; font-size: 13px; display: flex; flex-direction: column">
          <span>{{r.title}}</span>
          <span style="color: #bbb; font-size: 12px">{{r.giver}} – {{r.place}}</span>
        </button>
      </sc-for>
      <span style="color: #888; font-size: 11px">Grau = später verfügbar (Level oder Vorquest fehlt)</span>
    </div>
    <span style="font-size: 12px; color: #ffd100">{{picked}}</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":520}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { zoneOpen: true, picked: '' };
  }
  renderVals() {
    const s = this.state;
    const pick = (place) => () => this.setState({ picked: 'Kartenpunkt gesetzt: ' + place });
    const ZONE = [
      ['Die Bruderschaft', 'Die Todesminen', 'Wilder Klippenschmied', 'Westfall (56, 47)'],
      ['Rote Seidenkopftücher', 'Die Todesminen', 'Späher Riell', 'Westfall (56, 47)'],
      ['Die Verteidigung des Königreichs – Schritt 6/7', 'Die Todesminen', 'Gryan Starkmantel', 'Westfall (56, 47)']
    ];
    const ACCEPT = [
      ['Gesammelte Erinnerungen', 'Wilder Klippenschmied', 'Sturmwind (70, 41)', '#f2f2f2'],
      ['Die Verteidigung des Königreichs – Schritt 7/7', 'Gryan Starkmantel', 'Westfall (56, 47)', '#f2f2f2'],
      ['Ein Mittel gegen die Verwesung (ab Level 18)', 'Gegenstand', 'Rotkammgebirge (26, 44)', '#9d9d9d'],
      ['Oh Bruder…', 'Questgeber', 'Sturmwind (65, 21)', '#9d9d9d']
    ];
    return {
      zoneOpen: s.zoneOpen, picked: s.picked,
      closeZone: () => this.setState({ zoneOpen: false }),
      openZone: () => this.setState({ zoneOpen: true }),
      zoneRows: ZONE.map(([title, instance, giver, place]) => ({ title, instance, giver, place, pick: pick(place) })),
      acceptRows: ACCEPT.map(([title, giver, place, color]) => ({ title, giver, place, color, pick: pick(place) }))
    };
  }
}
</script>
</body>
</html>
